<!doctype html>
<html lang="ja" data-theme="%koma.theme%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		%koma.themeColor%
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<meta name="apple-mobile-web-app-title" content="コマあわせ" />
		<!-- What shows when a link is shared (LINE, X, Slack…): the title, line and picture are the
			 root layout's (src/lib/share-card.ts). -->
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="コマあわせ" />
		<meta property="og:locale" content="ja_JP" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta name="twitter:card" content="summary_large_image" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
