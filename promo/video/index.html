<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>コマあわせ 紹介動画</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700&family=Zen+Maru+Gothic:wght@500;700&display=block">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
/* A 30-second video on a fixed stage, scaled to fit a dark frame. The stage is always the app's light paper. */
:root {
	color-scheme: dark; --frame: #1C1A18; --frame-fg: #EEE7DA;
	--kinari: #F6F2EA; --men: #FFFDF8; --sumi: #2B2824; --sumi2: #4A443C; --sub: #6B645A; --line: #E4DDCF;
	--shu: #D9653B; --ai: #3569A8; --empty: #EDE7DA;
	--maru: 'Zen Maru Gothic', sans-serif; --kaku: 'Zen Kaku Gothic New', sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { background: var(--frame); color: var(--sumi); font-family: var(--kaku); overflow: hidden; -webkit-font-smoothing: antialiased; }
body.render { background: var(--kinari); }

#stage { position: absolute; left: 0; top: 0; overflow: hidden; background: var(--kinari); transform-origin: 0 0; }
.v #stage, #stage.v { width: 1080px; height: 1920px; }
#stage.h { width: 1920px; height: 1080px; }
.scene { position: absolute; inset: 0; visibility: hidden; }
.abs { position: absolute; }

/* faint ruled paper, like a timetable sheet */
#paper { position: absolute; inset: -200px; background-image:
	linear-gradient(var(--line) 2px, transparent 2px), linear-gradient(90deg, var(--line) 2px, transparent 2px);
	background-size: 120px 120px; opacity: .45; }

/* titles: lines are masks, characters rise out of them */
.title { position: absolute; font-family: var(--maru); font-weight: 700; line-height: 1.22; letter-spacing: .02em; color: var(--sumi); }
.title .ln { display: block; overflow: hidden; white-space: nowrap; padding: .06em .04em .1em; margin: -.06em -.04em -.1em; }
.title .ch { display: inline-block; will-change: transform; }
.title em { font-style: normal; color: var(--shu); }
.small { font-family: var(--kaku); font-weight: 500; color: var(--sub); }

/* the phone */
.phone { position: absolute; padding: calc(var(--pw) * .024); background: var(--sumi); border-radius: calc(var(--pw) * .14);
	width: var(--pw); box-shadow: 0 50px 90px -30px rgba(43,40,36,.45), 0 12px 24px -12px rgba(43,40,36,.3); }
.screen { position: relative; width: 100%; aspect-ratio: 1170 / 2532; border-radius: calc(var(--pw) * .118); overflow: hidden; background: var(--kinari); }
.screen > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: top; }
.pin { position: absolute; }
.ring { position: absolute; border: 6px solid var(--shu); border-radius: 18px; }
.tap { position: absolute; width: 90px; height: 90px; margin: -45px 0 0 -45px; border-radius: 50%; background: rgba(43,40,36,.22); border: 4px solid rgba(43,40,36,.5); }

/* koma: a rounded square */
.koma { position: absolute; border-radius: 22%; }
.cell { border-radius: 12px; display: flex; align-items: flex-start; justify-content: flex-start; overflow: hidden;
	font-family: var(--kaku); font-weight: 700; color: var(--sumi); line-height: 1.15; }

/* mini timetables */
.card { position: absolute; background: var(--men); border-radius: 36px; padding: 28px; box-shadow: 0 30px 60px -24px rgba(43,40,36,.35); }
.card .who { display: flex; align-items: center; gap: 14px; font-family: var(--maru); font-weight: 700; font-size: 34px; margin-bottom: 20px; }
.icon { display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; color: #FFFDF8; font-family: var(--maru); font-weight: 700; }
.grid { display: grid; gap: 8px; }

/* iso stack */
.iso-wrap { position: absolute; perspective: 5200px; }
.iso { position: absolute; left: 0; top: 0; transform-style: preserve-3d; }
.layer { position: absolute; left: 0; top: 0; transform-style: preserve-3d; }
.layer .plate { position: absolute; inset: -18px; border-radius: 34px; background: rgba(255,253,248,.28); border: 3px solid rgba(43,40,36,.16); }
.layer .tag { position: absolute; display: flex; align-items: center; gap: 12px; font-family: var(--maru); font-weight: 700; font-size: 36px; white-space: nowrap; }

.pill { display: inline-flex; align-items: center; gap: 12px; padding: 18px 34px; border-radius: 999px; background: var(--men);
	border: 3px solid var(--sumi); font-family: var(--maru); font-weight: 700; white-space: nowrap; }
.pill.dark { background: var(--sumi); color: var(--men); }

.notice { position: absolute; background: rgba(255,253,248,.97); border-radius: 44px; padding: 30px 34px; display: flex; gap: 26px; align-items: center;
	box-shadow: 0 40px 70px -24px rgba(43,40,36,.45), 0 0 0 2px rgba(43,40,36,.06); }
.notice .app { width: 96px; height: 96px; flex: none; border-radius: 24px; background: var(--kinari); display: flex; align-items: center; justify-content: center; }
.notice .top { display: flex; justify-content: space-between; font-size: 26px; color: var(--sub); margin-bottom: 4px; }
.notice b { display: block; font-size: 32px; line-height: 1.35; }
.notice span.b { font-size: 28px; color: var(--sub); }

.bubble { position: absolute; background: var(--men); border-radius: 40px 40px 40px 10px; padding: 22px 34px; font: 700 42px var(--maru); white-space: nowrap;
	box-shadow: 0 24px 44px -18px rgba(43,40,36,.4), 0 0 0 2px rgba(43,40,36,.06); }
.bubble.mine { background: #FBE3D6; border-radius: 40px 40px 10px 40px; }
#wipe { position: absolute; inset: 0; pointer-events: none; visibility: hidden; display: grid; }
#wipe i { display: block; border-radius: 26%; transform: scale(0); }

/* controls, not in the video */
#ui { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 10; }
#ui button { font-family: var(--maru); font-weight: 700; cursor: pointer; border: 0; }
#play { display: flex; flex-direction: column; align-items: center; gap: 18px; background: rgba(28,26,24,.72); color: #FFFDF8; padding: 34px 44px; border-radius: 28px; font-size: 20px; }
#play .tri { width: 88px; height: 88px; border-radius: 26px; background: var(--shu); display: flex; align-items: center; justify-content: center; }
#play small { font-family: var(--kaku); font-weight: 500; opacity: .8; font-size: 14px; }
#bar { position: fixed; left: 0; bottom: 0; height: 4px; background: var(--shu); width: 0; z-index: 11; }
#switch { position: fixed; right: 14px; top: 14px; z-index: 11; display: flex; gap: 6px; }
#switch a { font: 700 13px var(--maru); color: var(--frame-fg); background: rgba(28,26,24,.6); padding: 8px 12px; border-radius: 999px; text-decoration: none; border: 1px solid rgba(238,231,218,.3); }
#switch a.on { background: var(--frame-fg); color: var(--frame); }
#switch a:focus-visible, #play:focus-visible { outline: 3px solid var(--shu); outline-offset: 3px; }
.hide { display: none !important; }
body.playing #switch { opacity: 0; transition: opacity .4s; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="bar"></div>
<div id="switch"><a href="#v" data-ar="v">縦 9:16</a><a href="#h" data-ar="h">横 16:9</a></div>
<div id="ui"><button id="play" aria-label="再生"><span class="tri"><svg width="34" height="38" viewBox="0 0 34 38"><path d="M4 3.5v31a2 2 0 0 0 3 1.7l25-15.5a2 2 0 0 0 0-3.4L7 1.8a2 2 0 0 0-3 1.7z" fill="#FFFDF8"/></svg></span>タップして再生<small>音が出ます · 30秒</small></button></div>

<script>
// ─────────────────────────────────────────────────────────────
// Setup
// ─────────────────────────────────────────────────────────────
const P = new URLSearchParams(location.search);
const RENDER = P.has('render');
const HASH = location.hash.slice(1);
const AR = P.get('ar') === '16x9' || HASH === 'h' ? 'h' : P.get('ar') === '9x16' || HASH === 'v' ? 'v' : innerWidth > innerHeight ? 'h' : 'v';
const V = AR === 'v';
const W = V ? 1080 : 1920, H = V ? 1920 : 1080;
const BEAT = 0.5; // 120 BPM
const DUR = 30;
const stage = document.getElementById('stage');
stage.className = AR;
if (RENDER) document.body.classList.add('render');
document.querySelectorAll('#switch a').forEach((a) => {
	a.classList.toggle('on', a.dataset.ar === AR);
	// the stage is built once for one shape, so switching loads the page again
	a.addEventListener('click', (e) => { e.preventDefault(); if (a.dataset.ar !== AR) { location.hash = a.dataset.ar; location.reload(); } });
});

const COURSE = { red: '#F8DCDC', orange: '#FBE3D6', yellow: '#FFF0C7', lime: '#EEF2CF', green: '#E6EFD9', mint: '#D8EEE8', blue: '#DCE8F5', indigo: '#E0E1F4', purple: '#EFE3F3', gray: '#EDE7DA' };
const PEOPLE = {
	me: { name: 'あおい', t: 'あ', c: '#B9502B' },
	yui: { name: 'ゆい', t: 'ゆ', c: '#A3405F' },
	sota: { name: 'そうた', t: 'そ', c: '#3E7A4E' },
	rin: { name: 'りん', t: 'り', c: '#7A4E96' },
	haru: { name: 'はる', t: 'は', c: '#2F5F99' },
	kai: { name: 'かい', t: 'か', c: '#8A6414' }
};
// [weekday 1-5, period 1-5, span, short title, course color] — the same classes as the demo data in the app
const TT = {
	me: [[1,1,1,'英語','purple'],[3,2,1,'英語','purple'],[1,3,1,'デザイン','orange'],[1,4,1,'マーケ','mint'],[2,2,1,'統計','yellow'],[2,3,2,'プログラミング','blue'],[3,1,1,'心理学','red'],[3,5,1,'写真','lime'],[4,2,1,'経営','green'],[4,3,1,'映像','indigo'],[4,4,1,'データ','blue'],[5,1,1,'情報','mint'],[5,3,1,'ゼミ','gray']],
	yui: [[1,1,1,'英語','blue'],[3,2,1,'英語','blue'],[1,2,1,'フランス','purple'],[2,2,1,'統計','yellow'],[3,1,1,'心理学','red'],[4,3,1,'映像','indigo'],[4,4,1,'データ','mint'],[5,2,1,'簿記','green'],[2,5,1,'体育','orange']],
	sota: [[1,1,1,'法学','gray'],[1,3,1,'デザイン','orange'],[2,3,2,'プログラミング','blue'],[3,2,1,'中国語','red'],[4,2,1,'経営','green'],[4,5,1,'DB','purple'],[5,1,1,'情報','mint']],
	rin: [[2,1,1,'哲学','yellow'],[1,1,1,'英語','purple'],[3,2,1,'英語','purple'],[3,1,1,'心理学','red'],[4,3,1,'映像','indigo'],[5,3,1,'ゼミ','gray'],[5,5,1,'音楽','lime']],
	haru: [[3,5,1,'写真','lime'],[1,4,1,'マーケ','mint'],[2,2,1,'統計','yellow'],[4,1,1,'政治','red'],[5,2,2,'実験','blue']],
	kai: [[3,5,1,'写真','lime'],[2,3,2,'プログラミング','blue'],[4,5,1,'DB','purple'],[1,2,1,'物理','orange'],[5,4,1,'哲学','yellow']]
};
const tint = (hex, a) => `color-mix(in srgb, ${hex} ${a}%, #FFFDF8)`;
const LOGO = (s) => `<svg width="${s}" height="${s}" viewBox="0 0 48 48"><rect x="4" y="8" width="26" height="26" rx="7" fill="#D9653B"/><rect x="18" y="14" width="26" height="26" rx="7" fill="#3569A8" style="mix-blend-mode:multiply"/></svg>`;

const el = (html, parent = stage) => {
	const t = document.createElement('template');
	t.innerHTML = html.trim();
	const n = t.content.firstElementChild;
	parent.appendChild(n);
	return n;
};
const px = (n) => `${n}px`;

// Lines split by "/", characters as spans. <em>…</em> keeps its color.
function title(parent, text, css) {
	const lines = text.split(/(?<![<\s])\/(?!\s)/).map((line) => {
		let out = '', em = false;
		for (const part of line.split(/(<em>|<\/em>)/)) {
			if (part === '<em>') { em = true; continue; }
			if (part === '</em>') { em = false; continue; }
			for (const ch of part) out += `<span class="ch"${em ? ' style="color:var(--shu)"' : ''}>${ch === ' ' ? '&nbsp;' : ch}</span>`;
		}
		return `<span class="ln">${out}</span>`;
	}).join('');
	const n = el(`<div class="title">${lines}</div>`, parent);
	Object.assign(n.style, css);
	return n;
}
const chars = (n) => n.querySelectorAll('.ch');

function phone(parent, src, pw, css) {
	const n = el(`<div class="phone" style="--pw:${pw}px"><div class="screen"><img src="shots/${src}.webp" alt=""></div></div>`, parent);
	Object.assign(n.style, css);
	return n;
}
// Something placed over a phone's screen, by fractions of the screen
function onScreen(ph, html, [x0, y0, x1, y1]) {
	const n = el(html, ph.querySelector('.screen'));
	Object.assign(n.style, { left: `${x0 * 100}%`, top: `${y0 * 100}%`, width: `${(x1 - x0) * 100}%`, height: `${(y1 - y0) * 100}%` });
	return n;
}
function swapImg(ph, src) {
	const imgs = ph.querySelectorAll('.screen > img');
	const next = el(`<img src="shots/${src}.webp" alt="">`, ph.querySelector('.screen'));
	next.style.opacity = 0;
	imgs[imgs.length - 1].after(next);
	return next;
}

// A small timetable: 5 days × 5 periods
function miniGrid(parent, rows, { cell, gap, font, who, mode }) {
	const g = el(`<div class="grid" style="grid-template-columns:repeat(5,${cell}px);grid-template-rows:repeat(5,${cell}px);gap:${gap}px"></div>`, parent);
	const taken = new Set();
	for (const [d, p, span, t, col] of rows) {
		for (let i = 0; i < span; i++) taken.add(`${d}-${p + i}`);
		const bg = mode === 'person' ? tint(who.c, 45) : COURSE[col];
		const stripe = mode === 'person' ? `box-shadow: inset ${Math.round(cell * .07)}px 0 0 ${who.c};` : '';
		el(`<div class="cell" style="grid-column:${d};grid-row:${p} / span ${span};background:${bg};${stripe}font-size:${font}px;padding:${Math.round(cell * .1)}px ${Math.round(cell * .08)}px ${Math.round(cell * .1)}px ${Math.round(cell * (mode === 'person' ? .14 : .09))}px">${font ? t : ''}</div>`, g);
	}
	if (mode !== 'person') for (let d = 1; d <= 5; d++) for (let p = 1; p <= 5; p++)
		if (!taken.has(`${d}-${p}`)) el(`<div class="cell" style="grid-column:${d};grid-row:${p};background:var(--empty)"></div>`, g);
	return g;
}

// ─────────────────────────────────────────────────────────────
// Scenes
// ─────────────────────────────────────────────────────────────
const tl = gsap.timeline({ paused: true, defaults: { ease: 'expo.out', duration: 0.6 } });
const show = (s, t) => tl.set(s, { visibility: 'visible' }, t);
const hide = (s, t) => tl.set(s, { visibility: 'hidden' }, t);
const rise = (n, t, o = {}) => tl.fromTo(chars(n), { yPercent: 115, rotate: 6 }, { yPercent: 0, rotate: 0, duration: 0.7, stagger: o.stagger ?? 0.035, ease: 'expo.out' }, t);
const sink = (n, t, o = {}) => tl.to(chars(n), { yPercent: -115, duration: 0.35, stagger: o.stagger ?? 0.012, ease: 'power3.in' }, t);
const pop = (n, t, o = {}) => tl.fromTo(n, { scale: 0, rotate: o.rot ?? -8 }, { scale: 1, rotate: 0, duration: o.d ?? 0.6, ease: o.ease ?? 'back.out(2.2)' }, t);

const bg = el('<div id="paper"></div>');

// What is thrown onto the screen in the mess at 2–4.75s; the music hits the same times
const THROWS = [
	[2.0, 'card', 'me'], [2.25, 'bubble', '何限あいてる？'], [2.5, 'card', 'yui'], [2.75, 'shot'],
	[3.0, 'card', 'sota'], [3.125, 'bubble', '火曜の3限は？'], [3.25, 'card', 'rin'], [3.5, 'bubble', 'スクショ送るね'],
	[3.625, 'card', 'haru'], [3.75, 'shot'], [3.875, 'bubble', 'それ前期のやつ…'], [4.0, 'card', 'kai'],
	[4.25, 'bubble', '木曜はむり'], [4.5, 'bubble', '？？？'], [4.75, 'shot']
];
// Same numbers on every render
let seed = 11;
const rand = (a = 0, b = 1) => { seed = (seed * 16807) % 2147483647; return a + (b - a) * ((seed - 1) / 2147483646); };

// Big words on a sumi pill, centered
function band(parent, text, css) {
	return title(parent, text, { left: '50%', fontSize: V ? '62px' : '54px', color: 'var(--men)', background: 'var(--sumi)', padding: V ? '22px 46px' : '18px 40px', borderRadius: '999px', ...css });
}
const bandIn = (n, t) => {
	tl.set(n, { xPercent: -50 }, 0);
	tl.fromTo(n, { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: 'back.out(2)' }, t);
	tl.fromTo(chars(n), { yPercent: 115 }, { yPercent: 0, duration: 0.5, stagger: 0.02 }, t + 0.05);
};
const bandOut = (n, t) => tl.to(n, { scale: 0.85, opacity: 0, duration: 0.22, ease: 'power2.in' }, t);
const sinkFast = (n, t) => tl.to(chars(n), { yPercent: -115, duration: 0.2, stagger: 0.006, ease: 'power3.in' }, t);
const PHONE_AT = (pw, top = 560) => (V ? { left: W / 2 - pw / 2, top } : { left: 620 - pw / 2, top: H / 2 - pw * 1.1 });
const phoneH = (pw) => pw * 2532 / 1170 + pw * 0.048;
// Zooms the whole phone so that a point of its screen ([fx, fy] of the phone) comes to (tx, ty) on the stage
function zoomPhone(ph, pos, pw, [fx, fy], scale, [tx, ty], t, d) {
	tl.set(ph, { transformOrigin: `${fx * 100}% ${fy * 100}%` }, t - 0.01);
	tl.to(ph, { scale, x: tx - (pos.left + fx * pw), y: ty - (pos.top + fy * phoneH(pw)), duration: d, ease: 'expo.inOut' }, t);
}
const unzoomPhone = (ph, t, d) => tl.to(ph, { scale: 1, x: 0, y: 0, duration: d, ease: 'expo.inOut' }, t);

// ── 1. 0–6s: 今度いつ、集まれる？ then a pile of timetables and messages that never line up ──
const s1 = el('<div class="scene" id="s1"></div>');
show(s1, 0);
const LOGO_AT = { x: W / 2, y: V ? 760 : 400 };
{
	// eight koma fall in with the first four notes of the chime, two per note
	const spots = V
		? [[120, 330, 170, 'orange', -12], [770, 250, 210, 'blue', 10], [860, 1380, 150, 'yellow', 14], [90, 1480, 230, 'mint', -8], [640, 1600, 130, 'purple', 6], [300, 180, 120, 'lime', 18], [420, 1720, 150, 'red', -16], [830, 700, 120, 'indigo', -10]]
		: [[140, 120, 190, 'orange', -12], [1580, 130, 210, 'blue', 10], [1660, 760, 150, 'yellow', 14], [180, 760, 200, 'mint', -8], [1300, 860, 120, 'purple', 6], [560, 90, 110, 'lime', 18], [720, 880, 130, 'red', -16], [1380, 380, 110, 'indigo', -10]];
	const komas = spots.map(([x, y, s, c]) => el(`<div class="koma" style="left:${x}px;top:${y}px;width:${s}px;height:${s}px;background:${COURSE[c]};box-shadow:inset 0 0 0 3px rgba(43,40,36,.06)"></div>`, s1));
	komas.forEach((k, i) => {
		const r = spots[i][4];
		tl.fromTo(k, { y: -H * 0.7, rotate: r * 3, scale: 0.9 }, { y: 0, rotate: r, scale: 1, duration: 0.5, ease: 'bounce.out' }, Math.floor(i / 2) * BEAT + (i % 2) * 0.12 - 0.08);
		// and drift while the mess builds up
		tl.to(k, { x: rand(-70, 70), y: rand(-50, 50), rotate: r + rand(-30, 30), duration: 3.3, ease: 'sine.inOut' }, 2.1);
	});
	const q = title(s1, '今度いつ/集まれる？', V ? { left: '90px', top: '760px', fontSize: '150px' } : { left: '0', right: '0', top: '330px', fontSize: '150px', textAlign: 'center' });
	const qc = chars(q);
	tl.fromTo([...qc].slice(0, 2), { yPercent: 115 }, { yPercent: 0, duration: 0.55, stagger: 0.04 }, 0.02);
	tl.fromTo([...qc].slice(2, 5), { yPercent: 115 }, { yPercent: 0, duration: 0.55, stagger: 0.04 }, 0.5);
	tl.fromTo([...qc].slice(5), { yPercent: 115 }, { yPercent: 0, duration: 0.6, stagger: 0.04 }, 1.0);
	tl.fromTo(qc[qc.length - 1], { rotate: 0 }, { rotate: 14, duration: 0.25, yoyo: true, repeat: 3, ease: 'sine.inOut' }, 1.45);
	tl.to(q, { y: V ? -520 : -240, scale: 0.55, transformOrigin: V ? '0% 0%' : '50% 0%', duration: 0.6, ease: 'expo.inOut' }, 1.75);

	// 2–4.75s: timetables, screenshots and messages are thrown on top of each other
	const items = [];
	const card = (k, cell) => {
		const p = PEOPLE[k];
		const c = el(`<div class="card" style="padding:${Math.round(cell * 0.4)}px"><div class="who" style="font-size:${Math.round(cell * 0.5)}px"><span class="icon" style="width:${Math.round(cell * 0.75)}px;height:${Math.round(cell * 0.75)}px;background:${p.c};font-size:${Math.round(cell * 0.4)}px">${p.t}</span>${p.name}</div></div>`, s1);
		miniGrid(c, TT[k], { cell, gap: Math.round(cell * 0.12), font: 0 });
		return c;
	};
	const shot = (cell) => {
		const c = el(`<div class="card" style="padding:${Math.round(cell * 0.4)}px;background:#fff"><div style="height:${Math.round(cell * 0.35)}px;width:60%;border-radius:8px;background:#D6D9DE;margin-bottom:${Math.round(cell * 0.3)}px"></div></div>`, s1);
		const g = el(`<div class="grid" style="grid-template-columns:repeat(5,${cell}px);grid-template-rows:repeat(5,${cell}px);gap:${Math.round(cell * 0.12)}px"></div>`, c);

		[[0, 'D6'], [2, 'C6'], [3, 'A5'], [5, 'G5'], [6, 'E5']],
		[[0, 'E5'], [1, 'G5'], [3, 'A5'], [4, 'C6'], [6, 'A5']],
		[[0, 'D5'], [2, 'F5'], [3, 'G5'], [4, 'A5'], [5, 'C6'], [6, 'D6']]
	];
	impact(10.0, 0.7);
	for (let bar = 0; bar < 8; bar++) {
		const t0 = 10 + bar * 2;
		const { ch, root } = PROG[bar % 4];
		for (let b = 0; b < 4; b++) {
			kick(t0 + b * BEAT);
			hat(t0 + b * BEAT + 0.25, true, 0.1, 0.25);
			if (b % 2) clap(t0 + b * BEAT);
		}
		for (let s = 0; s < 16; s++) if (s % 2 === 0 || bar >= 6) hat(t0 + s * 0.125, false, s % 4 === 2 ? 0.08 : 0.05, -0.2);
		const R = f(root);
		[[0, 1, 0.22], [0.75, 2, 0.2], [1.0, 1, 0.2], [1.5, 2, 0.2], [1.75, 1, 0.2]].forEach(([d, m, len]) => bass(t0 + d, R * m, len + 0.05, m === 1 ? 0.44 : 0.3));
		[0.25, 0.75, 1.25, 1.75].forEach((d, i) => ep(t0 + d, ch, i === 3 ? 0.4 : 0.22, 0.032));
		pad(t0, ch, 2, 0.012, 2200);
		if (bar < 6) MEL[bar % 4].forEach(([e, n]) => { marimba(t0 + e * 0.25, f(n), 0.3, mus, 0.15); bell(t0 + e * 0.25, f(n) * 2, 0.025, 0.5, mus, -0.3); });
	}
	// 22–26: the chime comes back, two notes for each of the four features
	CHIME.forEach((n, i) => { marimba(22 + i * BEAT, f(n) * 2, 0.28); bell(22 + i * BEAT, f(n) * 2, 0.08, 0.9); });
	[22, 23, 24, 25].forEach((t) => { tick(t - 0.02, 0.07); if (t > 22) whoosh(t - 0.08, 0.28, 0.1); });
	poko(23.45, 900, 0.22);
	// effects for 10–22
	[10.5, 10.875, 11.25, 11.625].forEach((t, i) => thump(t + 0.28, 70 + i * 16, 0.45));
	whoosh(11.9, 0.45, 0.16);
	['C6', 'D6', 'F6', 'G6'].forEach((n, i) => poko(12.5 + i * 0.25 + 0.02, f(n) / 1.6, 0.26, (i - 1.5) * 0.3));
	poko(13.5, f('A6') / 1.6, 0.26);
	whoosh(13.8, 0.45, 0.2);
	tick(14.5, 0.25);
	poko(14.8, 600, 0.3);
	thump(15.45, 150, 0.35);
	whoosh(15.8, 0.3, 0.12);
	thump(16.5, 120, 0.4);
	riser(16.6, 0.7, 0.1);
	bell(17.3, f('C6'), 0.1, 1.2); bell(17.48, f('F6'), 0.1, 1.5);
	whoosh(17.62, 0.4, 0.22);
	whoosh(18.1, 0.8, 0.12);
	poko(18.6, 700, 0.24);
	whoosh(19.2, 0.5, 0.1, false);
	bell(19.45, f('E6'), 0.16, 1.2, sfx); bell(19.6, f('A6'), 0.16, 1.6, sfx);
	whoosh(20.15, 0.3, 0.12, false);
	whoosh(20.35, 0.35, 0.18);
	poko(20.85, 800, 0.25);
	whoosh(21.62, 0.4, 0.22);
	// into the end
	[25.5, 25.625, 25.75, 25.8125, 25.875, 25.9375].forEach((t, i) => clap(t, 0.1 + i * 0.035));
	whoosh(25.62, 0.4, 0.2);
	// 26–30: the end card, the chime's last phrase over F
	kick(26); crash(26, 0.14); impact(26, 0.3);
	bass(26, f('F2') * 2, 2.8, 0.2);
	pad(26, ['F3', 'A3', 'C4', 'E4', 'G4'], 3.6, 0.016, 2000);
	ep(26, ['F4', 'A4', 'C5', 'E5'], 3, 0.05);
	['C5', 'G5', 'A5', 'F5'].forEach((n, i) => { bell(26.5 + i * BEAT, f(n), 0.16, 2.6, mus, (i % 2 ? 0.2 : -0.2)); marimba(26.5 + i * BEAT, f(n), 0.18); });
	poko(27.1, 700, 0.25);
	// fade the very end
	master.gain.setValueAtTime(0.9, at(29.2));
	master.gain.linearRampToValueAtTime(0.0001, at(30.0));
}

// ─────────────────────────────────────────────────────────────
// Playback, and hooks for rendering the MP4
// ─────────────────────────────────────────────────────────────
function fit() {
	if (RENDER) { stage.style.transform = ''; return; }
	const s = Math.min(innerWidth / W, innerHeight / H);
	stage.style.transform = `translate(${(innerWidth - W * s) / 2}px, ${(innerHeight - H * s) / 2}px) scale(${s})`;
}
addEventListener('resize', fit);
fit();

const imgsLoaded = Promise.all([...document.images].map((i) => i.complete ? 0 : new Promise((r) => { i.onload = i.onerror = r; })));
window.ready = Promise.all([document.fonts.ready, imgsLoaded]).then(() => new Promise((r) => requestAnimationFrame(() => r(true))));
window.seek = (t) => { tl.time(t, false); };
window.renderAudio = async () => {
	const sr = 48000, len = Math.ceil((DUR + 0.2) * sr);
	const ctx = new OfflineAudioContext(2, len, sr);
	buildMusic(ctx, ctx.destination, 0);
	const buf = await ctx.startRendering();
	// 16-bit WAV, as base64
	const n = buf.length, data = new DataView(new ArrayBuffer(44 + n * 4));
	const w = (o, s) => [...s].forEach((c, i) => data.setUint8(o + i, c.charCodeAt(0)));
	w(0, 'RIFF'); data.setUint32(4, 36 + n * 4, true); w(8, 'WAVE'); w(12, 'fmt ');
	data.setUint32(16, 16, true); data.setUint16(20, 1, true); data.setUint16(22, 2, true); data.setUint32(24, sr, true);
	data.setUint32(28, sr * 4, true); data.setUint16(32, 4, true); data.setUint16(34, 16, true); w(36, 'data'); data.setUint32(40, n * 4, true);
	const L = buf.getChannelData(0), R = buf.getChannelData(1);
	for (let i = 0; i < n; i++) {
		data.setInt16(44 + i * 4, Math.max(-1, Math.min(1, L[i])) * 32767, true);
		data.setInt16(46 + i * 4, Math.max(-1, Math.min(1, R[i])) * 32767, true);
	}
	const bytes = new Uint8Array(data.buffer);
	let bin = '';
	for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
	return btoa(bin);
};

const ui = document.getElementById('ui'), bar = document.getElementById('bar');
if (RENDER) {
	ui.classList.add('hide'); bar.classList.add('hide'); document.getElementById('switch').classList.add('hide');
	tl.time(Number(P.get('t') ?? 0));
} else {
	// the poster: the logo
	window.ready.then(() => tl.time(8.6));
	let ctx, t0, raf;
	const loop = () => {
		const t = ctx.currentTime - t0 - (ctx.outputLatency || 0);
		tl.time(Math.max(0, Math.min(DUR, t)));
		bar.style.width = `${Math.max(0, Math.min(1, t / DUR)) * 100}%`;
		if (t < DUR + 0.3) raf = requestAnimationFrame(loop);
		else { document.body.classList.remove('playing'); ui.classList.remove('hide'); }
	};
	const start = async () => {
		cancelAnimationFrame(raf);
		if (ctx) ctx.close();
		ctx = new AudioContext({ latencyHint: 'playback' });
		await ctx.resume();
		await window.ready;
		t0 = ctx.currentTime + 0.12;
		buildMusic(ctx, ctx.destination, t0);
		ui.classList.add('hide');
		document.body.classList.add('playing');
		loop();
	};
	document.getElementById('play').addEventListener('click', start);
	addEventListener('keydown', (e) => { if (e.code === 'Space') { e.preventDefault(); start(); } });
}
